name: Desktop packages (Windows, macOS, Linux)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - '.github/workflows/desktop.yml'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-15-intel
            name: macos-intel
          - os: macos-15
            name: macos-apple-silicon
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and desktop dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Backend tests
        run: npm test
      - name: Build and package desktop app
        run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/XR18-Studio-Windows-*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'XR18SmokeInstall'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installation failed: $($result.ExitCode)" }
          node desktop/smoke.cjs (Join-Path $installDir 'XR18 Studio.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows application failed to start' }
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: xr18-studio-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error


